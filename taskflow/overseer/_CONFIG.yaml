# nswe-demo thread CONFIG SEAM  (_CONFIG.yaml)
#
# Conforms to the serial-thread CONFIG SEAM defined in the kernel at
#   ~/Nousix/development/actors/thread/SERIAL_COMPOSITION_FRAMEWORK.md  (section: The Config Seam)
#
# This is the NSWE overseer thread's durable operating configuration. The engine provides the
# seam; the NSWE app defines these contents (the thread analog of a DAG contract). It is a
# first-class on-disk file at the thread root (taskflow/overseer/), read by every overseer
# iteration at boot and writable in place; reconstruction surfaces it on every resume.
#
# It carries the operating variables that previously lived (fragile) only in the prose
# `engagement` block of project_state.json and were dropped at I127 -- which reverted the
# overseer to the app-files human-at-gate default and parked PR #113. Restored from the
# last-good engagement block at taskflow/overseer/I126/project_state.json.

schema: nswe-overseer/config.v1

# --- Landing authority (the variable whose prose-only life caused the I127 regression) ---
landing_authority: delegated   # overseer holds delegated authority to land PRs
auto_land: true                # auto-land on machine PASS + review APPROVE; no human approve step
headless: true                 # headless engagement -- no interactive human-at-gate channel exists

# --- Engagement identity ---
project_id: nswe-demo
repo: Nousix-LLC/nswe-demo
working_branch: main

