  SUBTASK_web_delivery_api:      # one web address, SPA routing, typed API operations as experienced, pagination, typed errors, health endpoint, data over time
    [BAR-166, BAR-169, BAR-170, BAR-171, BAR-172, BAR-173, BAR-176, BAR-177, BAR-406, BAR-462]

# Expected per-cluster counts (row tags, not prose). The fold asserts the unioned table matches these and totals 139;
# a mismatch is a reported gap, never silently reconciled.
expected_counts:
  SUBTASK_getin_identity:       22
  SUBTASK_core_loop:            24
  SUBTASK_account_lifecycle:    20
  SUBTASK_resilience_states:    12
  SUBTASK_safety_trust_support:  8
  SUBTASK_visual_craft_nav:     16
  SUBTASK_responsive_phone:      9
  SUBTASK_accessibility:        18
  SUBTASK_web_delivery_api:     10
  total:                       139

ownership:
  "SUBTASK_getin_identity/outputs/getin-identity-measurement.md":            SUBTASK_getin_identity
  "SUBTASK_core_loop/outputs/core-loop-measurement.md":                      SUBTASK_core_loop
  "SUBTASK_account_lifecycle/outputs/account-lifecycle-measurement.md":      SUBTASK_account_lifecycle
  "SUBTASK_resilience_states/outputs/resilience-states-measurement.md":      SUBTASK_resilience_states
  "SUBTASK_safety_trust_support/outputs/safety-trust-support-measurement.md": SUBTASK_safety_trust_support
  "SUBTASK_visual_craft_nav/outputs/visual-craft-nav-measurement.md":        SUBTASK_visual_craft_nav
  "SUBTASK_responsive_phone/outputs/responsive-phone-measurement.md":        SUBTASK_responsive_phone
  "SUBTASK_accessibility/outputs/accessibility-measurement.md":              SUBTASK_accessibility
  "SUBTASK_web_delivery_api/outputs/web-delivery-api-measurement.md":        SUBTASK_web_delivery_api
  "outputs/live-journeys-measurement.md":                                    SUBTASK_journeys_fold   # the unioned bar_id-keyed table + preamble (this subtree's declared output)
  "SYNTHESIS.md (at SUBTASK_live_journeys/ root)":                           SUBTASK_journeys_fold   # the fold record
# No artifact has two owners. Each cluster child owns a disjoint partition; the fold owns only the union.

identities:
  - id: CLUSTER_DISJOINT_TOTAL
    statement: "The nine clusters' bar_id sets are pairwise disjoint and union to exactly the 139 manual_user_check
                BAR-* in the release bar; each such BAR-* appears under exactly one cluster, matching the partition
                table above."
  - id: MANUAL_STATUS_TOTAL
    statement: "Every one of the 139 manual_user_check BAR-* carries exactly one live_status in {met, partial,
                missing, not_applicable} with a recorded observation."
  - id: OBSERVATION_GROUNDED
    statement: "Every observation is grounded in an actual exercise of the live product or an actual repository/SPA/API
                artifact at c805525; a criterion that cannot be observed in this environment is judged conservatively
                with the reason stated — never assumed or confabulated, never judged optimistically."
  - id: VOCAB_CONFORMS
    statement: "Every live_status value is from the inherited vocab and every bar_id is a verbatim release-bar id."
  - id: OUTPUT_HYGIENE
    statement: "outputs/live-journeys-measurement.md (and anything that could reach GitHub) carries no
                host/system/taskflow detail — repository identity only (owner/repo, commit SHA, repo-relative paths,
                BAR-*/REQ- ids). Its preamble records only that the live product was reached (or why not), by
                repository/commit identity."

derived_artifacts:
  - name: manual_user_check_table
    generated_from: "union of the nine cluster verdict tables, keyed by bar_id"
    produced_by: SUBTASK_journeys_fold
    consumed_by: "SUBTASK_measurement_fold (parent) — unioned with the automated_test, inspection, and
                  operational_check partitions into outputs/live-measurement.md"

# Fold wiring (described, not over-specified; the fold agent resolves exact syscalls at runtime against the kernel
# fold contract):
#   - SUBTASK_journeys_fold reads the nine cluster outputs, unions them into ../outputs/live-journeys-measurement.md
#     (this subtree's declared output), authors ../SYNTHESIS.md at this subtree root (the fold location), and resolves
#     SUBTASK_live_journeys SUSPENDED -> COMPLETED with that record as the fold seam.
