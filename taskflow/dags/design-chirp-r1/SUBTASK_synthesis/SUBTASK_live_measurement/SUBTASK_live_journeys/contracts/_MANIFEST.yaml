# Contract manifest — SUBTASK_live_journeys (manual_user_check measurement subtree)
# kind: yaml_schema. Extends ../../contracts/_MANIFEST.yaml (measurement sub-contract) and
# ../../../../contracts/id_and_traceability_schema.yaml ADDITIVELY. Never overrides the inherited live_status vocab,
# the verification_method vocab, the verdict_row_schema columns, or the gate join seam.
# READ-ONLY for every descendant of this subtree.

kind: yaml_schema

extends: "../../contracts/_MANIFEST.yaml"                        # measurement sub-contract: verdict_row_schema, live_status_key=bar_id
also_inherits:
  - "../../../../contracts/id_and_traceability_schema.yaml"      # live_status vocab; closed verification_method vocab

# ---------------------------------------------------------------------------
# The seam: ONE bar_id-keyed verdict table over the 139 manual_user_check BAR-*, partitioned across nine coherent
# journey/surface clusters by the EXPLICIT per-cluster assignment below, then unioned and checked for totality by the
# fold. Inherited, not redefined:
#   live_status vocab: [met, partial, missing, not_applicable]
#   verification_method: manual_user_check  (this whole subtree is that one partition of the parent measurement)
#   verdict_row_schema.columns: [bar_id, live_status, observation]
#   live_status_key: bar_id   (one verdict row per BAR-*)
# ---------------------------------------------------------------------------

# Each cluster child emits a verdict table with EXACTLY the inherited verdict_row_schema columns — one row per BAR-*
# it owns. (Schema inherited from ../../contracts/_MANIFEST.yaml; not redefined here.)

# The partition key is an EXPLICIT bar_id -> cluster assignment (NOT the release bar's area/number blocks: a journey
# cluster deliberately cuts across area blocks). Disjoint by construction (each BAR-* listed under exactly one
# cluster) and total (the nine lists union to all 139 manual_user_check BAR-*), verified before any child ran.
partition_by: journey_cluster
partition:
  SUBTASK_getin_identity:        # get-in & identity journeys: signed-out entry, sign-up, sign-in, sign-out, session, recovery, verified contact
    [BAR-014, BAR-015, BAR-112, BAR-113, BAR-114, BAR-115, BAR-116, BAR-200, BAR-206, BAR-207,
     BAR-213, BAR-230, BAR-231, BAR-236, BAR-300, BAR-303, BAR-304, BAR-316, BAR-321, BAR-322,
     BAR-323, BAR-338]
  SUBTASK_core_loop:             # account model, compose & post, reply, like, follow, home timeline, public profiles
    [BAR-100, BAR-101, BAR-102, BAR-104, BAR-105, BAR-106, BAR-107, BAR-108, BAR-109, BAR-110,
     BAR-111, BAR-117, BAR-163, BAR-209, BAR-211, BAR-212, BAR-238, BAR-239, BAR-242, BAR-243,
     BAR-244, BAR-245, BAR-246, BAR-247]
  SUBTASK_account_lifecycle:     # settings hub, edit profile, verified-contact view/change, sessions/devices, export, deletion, data rights
    [BAR-018, BAR-019, BAR-022, BAR-118, BAR-119, BAR-210, BAR-214, BAR-228, BAR-249, BAR-250,
     BAR-251, BAR-254, BAR-317, BAR-318, BAR-319, BAR-325, BAR-327, BAR-328, BAR-330, BAR-411]
  SUBTASK_resilience_states:     # empty/loading/failed/not-found states, onboarding, session-expiry recovery, action feedback
    [BAR-026, BAR-027, BAR-028, BAR-029, BAR-226, BAR-240, BAR-248, BAR-259, BAR-260, BAR-261,
     BAR-262, BAR-263]
  SUBTASK_safety_trust_support:  # reporting, rules/terms, help & support, operator surface, status/degraded notice
    [BAR-023, BAR-025, BAR-256, BAR-257, BAR-258, BAR-334, BAR-482, BAR-485]
  SUBTASK_visual_craft_nav:      # navigation shell, consistency, layout, reading column, typography, contrast, layering, motion, copy, shared treatment
    [BAR-201, BAR-202, BAR-204, BAR-208, BAR-215, BAR-216, BAR-217, BAR-219, BAR-220, BAR-221,
     BAR-222, BAR-223, BAR-224, BAR-225, BAR-227, BAR-229]
  SUBTASK_responsive_phone:      # typical-phone / responsive experience across the core loop and surfaces
    [BAR-030, BAR-265, BAR-267, BAR-268, BAR-269, BAR-270, BAR-271, BAR-272, BAR-274]
  SUBTASK_accessibility:         # keyboard & screen-reader path, WCAG checks
    [BAR-031, BAR-218, BAR-276, BAR-277, BAR-278, BAR-279, BAR-280, BAR-281, BAR-282, BAR-283,
