# Spoke Findings Schema — design-doc-review subtree
# Each spoke in this subtree produces an intermediate YAML file conforming to this schema.
# The synthesis task reads and validates all spoke outputs against this schema before merging.
# Read-only for all descendants.

# This schema is structurally identical to the parent's findings_schema.yaml,
# except that each spoke file is restricted to its own concern_ids.
# The synthesis task merges the spoke outputs into the final design-doc-findings.md
# conforming to the ancestor findings_schema.yaml.

type: object
description: >
  Intermediate findings document from one spoke in the design-doc-review subtree.
  Structurally compatible with (and a partial form of) the parent findings_schema.yaml.

required_fields:
  - spoke
  - concern_ids
  - findings

fields:
  spoke:
    type: string
    description: >
      Always "design-doc-review" for files produced by spokes in this subtree.
    value: design-doc-review

  concern_ids:
    type: array
    items: integer (1–3)
    description: >
      Which review concern numbers this spoke file addresses.
      - SUBTASK_completeness-review: [1]
      - SUBTASK_release-bar-quality: [2]
      - SUBTASK_traceability-review: [3]

  findings:
    type: array
    description: One entry per finding; may be empty if no issues found.
    item_fields:
      id:
        type: string
        description: >
          Unique id within this file.
          Recommended prefixes:
            SUBTASK_completeness-review: DDR-C-001, DDR-C-002, ...
            SUBTASK_release-bar-quality: DDR-B-001, DDR-B-002, ...
            SUBTASK_traceability-review: DDR-T-001, DDR-T-002, ...
        required: true

      severity:
        type: string
        enum: [BLOCKING, non-blocking]
        description: >
          BLOCKING: gap that would require REQUEST-CHANGES on PR#128 —
          a missing required surface, a bar item that cannot be verified by
          an outside reviewer, or a traceability break.
          non-blocking: improvement that should be filed as a board issue.
        required: true

      concern:
        type: integer (1–3)
        description: Which review concern this finding addresses (1, 2, or 3).
        required: true

      location:
        type: string
        description: >
          The specific document + section (e.g. "release-bar.md §BAR-FERRIC-004")
          or issue number (e.g. "issue #133") where the gap was observed.
          Must name the specific file and section, not just "the design".
        required: true

      statement:
        type: string
        description: >
          What is missing, wrong, or unclear — stated as a checkable claim.
          A reviewer with no prior context must be able to verify this.
        required: true

      recommendation:
        type: string
        description: What action would resolve this finding.
        required: true

  summary:
    type: object
    required: false
    description: Optional summary counts for the synthesis task.
    fields:
      blocking_count:
        type: integer
      non_blocking_count:
        type: integer
      notes:
        type: string
