kind: subtree_manifest
version: "1.0"
task: SUBTASK_code_quality
description: >
  Ownership manifest and identity contracts for the SUBTASK_code_quality subtree.
  Three parallel analysis spokes cover all five concern areas; SUBTASK_synthesis
  merges their partial findings into the final code_quality_findings.md.

ownership:
  - artifact: "SUBTASK_format_check/format_review_partial.md"
    owner: SUBTASK_format_check
    concerns:
      - id: 1
        description: "structural coherence"
      - id: 4
        description: "formatting consistency"

  - artifact: "SUBTASK_placement_check/placement_review_partial.md"
    owner: SUBTASK_placement_check
    concerns:
      - id: 2
        description: "placement correctness"
      - id: 3
        description: "duplication"

  - artifact: "SUBTASK_completeness_check/completeness_review_partial.md"
    owner: SUBTASK_completeness_check
    concerns:
      - id: 5
        description: "documentation completeness as API contract"

  - artifact: "code_quality_findings.md"
    owner: SUBTASK_synthesis
    note: >
      Written to the SUBTASK_code_quality workspace root (one level above SUBTASK_synthesis/);
      this is the parent task's declared output consumed by SUBTASK_verdict.

identities:
  - "All five concern areas (1–5) are represented across the three spoke outputs"
  - "code_quality_findings.md follows ../contracts/findings_schema.yaml"
  - "The verdict in code_quality_findings.md is APPROVE only if no spoke raised a BLOCKER"
  - "No finding from any spoke is omitted from the final consolidated output"

inherited_contracts:
  - path: "../contracts/findings_schema.yaml"
    kind: findings_schema
    version: "1.0"
    binds: "Final output code_quality_findings.md"
  - path: "contracts/spoke_partial_schema.yaml"
    kind: spoke_partial_schema
    version: "1.0"
    binds: "Each spoke's intermediate findings file"
